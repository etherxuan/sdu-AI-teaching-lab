<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 的眼睛 · 选一个开始</title>
<meta name="description" content="先用放大镜看看照片里的像素，再训练一个会认叶子的 AI。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=20261110e">
<link rel="stylesheet" href="css/extra.css?v=20261110e">
</head>
<body class="home">

<div class="space" aria-hidden="true"></div>

<header class="hud-top">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M4 24c5.5-9 12.5-13.5 20-13.5S34.5 15 40 24c-5.5 9-12.5 13.5-20 13.5S9.5 33 4 24Z" stroke="currentColor" stroke-width="2.4"/>
        <circle cx="20" cy="24" r="6" fill="currentColor" opacity=".85"/>
        <circle cx="28.5" cy="19.5" r="2" fill="#fff"/>
      </svg>
    </span>
    <div class="brand-text">
      <p class="sys-code">第三单元 · 视觉</p>
      <h1>AI 的眼睛</h1>
    </div>
  </div>
  <div class="hud-right">
    <span class="chip"><i class="live"></i>不用注册</span>
    <span class="chip">照片不出设备</span>
  </div>
</header>

<main class="home-main">
  <p class="home-lead">先选一个：<b>看</b>照片里的小方块，或者<b>教</b>电脑认叶子。</p>

  <div class="home-cards">
    <a class="choice" href="pixel.html">
      <span class="choice-num">选择 1</span>
      <span class="choice-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <circle cx="27" cy="27" r="15" stroke="currentColor" stroke-width="3.2"/>
          <path d="M38 38l11 11" stroke="currentColor" stroke-width="4.2" stroke-linecap="round"/>
          <path d="M20 23h14M20 29h9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </span>
      <h2>像素放大镜</h2>
      <p>把照片放到最大，看到一格一格的小方块；鼠标指到哪儿，就告诉你那个格子的红绿蓝数值。</p>
      <span class="choice-go">打开放大镜 →</span>
    </a>

    <a class="choice" href="train.html">
      <span class="choice-num">选择 2</span>
      <span class="choice-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <path d="M32 10c-9 0-15 6.6-15 15v4l-5 7h40l-5-7v-4c0-8.4-6-15-15-15Z" stroke="currentColor" stroke-width="3"/>
          <circle cx="32" cy="30" r="5.5" stroke="currentColor" stroke-width="2.6"/>
          <path d="M24 43c2.6 4 13.4 4 16 0M27 51h10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </span>
      <h2>训练一个 AI</h2>
      <p>建两个类别、放进照片、点一下训练，再用新照片考考它：认得对，还是会被背景骗到？</p>
      <span class="choice-go">打开训练页面 →</span>
    </a>
  </div>

  <p class="home-note">两个页面都在你的浏览器里运行，不用登录，照片不会上传到任何服务器。</p>
</main>

<footer class="hud-bottom">
  <span><i class="live"></i>第三单元 · AI 的眼睛</span>
  <span>建议用 Chrome 或 Edge，电脑、平板都能打开</span>
</footer>

</body>
</html>
