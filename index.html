<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 的眼睛 · 视觉实验室</title>
<meta name="description" content="建立数据集、训练一个图像分类模型，再用新照片考考它。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=20261110">
</head>
<body>
<div class="space" aria-hidden="true"></div>

<header class="hud-top">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M4 24c5.5-9 12.5-13.5 20-13.5S34.5 15 40 24c-5.5 9-12.5 13.5-20 13.5S9.5 33 4 24Z" stroke="currentColor" stroke-width="2.4"/>
        <circle cx="20" cy="24" r="6" fill="currentColor" opacity=".85"/>
        <circle cx="28.5" cy="19.5" r="2" fill="#fff"/>
      </svg>
    </span>
    <div class="brand-text">
      <p class="sys-code">第三单元 · 视觉</p>
      <h1>AI 的眼睛</h1>
    </div>
  </div>
  <div class="hud-right">
    <span class="chip"><i class="live"></i>本地运算</span>
    <span class="chip">照片不出设备</span>
  </div>
</header>

<main class="deck">
  <!-- 01 数据集 -->
  <section class="panel panel-data" id="step-classes">
    <div class="panel-head">
      <span class="panel-code">STEP 01</span>
      <h2>数据集</h2>
      <span class="panel-status" id="classStatus">0 类 · 0 张</span>
    </div>
    <div class="panel-body">
      <div class="add-class">
        <input id="className" type="text" maxlength="12" placeholder="输入类别名，比如：银杏叶" autocomplete="off">
        <button class="btn add" id="addClassBtn" title="新建类别">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4"/></svg>
        </button>
      </div>
      <div class="suggest" id="suggest">
        <button type="button" data-name="银杏叶">银杏叶</button>
        <button type="button" data-name="枫叶">枫叶</button>
        <button type="button" data-name="苹果">苹果</button>
        <button type="button" data-name="香蕉">香蕉</button>
      </div>
      <div class="class-grid" id="classGrid"></div>
      <div class="empty-state" id="classEmpty">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none"><rect x="7" y="12" width="30" height="24" rx="4" stroke="currentColor" stroke-width="2.4"/><path d="M12 40h20M40 22h17v30H28" stroke="currentColor" stroke-width="2.4"/><circle cx="22" cy="24" r="3" fill="currentColor"/></svg>
        </div>
        <p><b>还没有任何类别</b>先建立一个类别，再往里放照片。</p>
      </div>
    </div>
    <div class="panel-foot">小提示：每类 5–20 张，白底、正面、光线均匀，AI 更容易学会。</div>
  </section>

  <!-- 02 训练核心 -->
  <section class="panel panel-core" id="step-train">
    <div class="panel-head">
      <span class="panel-code">STEP 02</span>
      <h2>训练</h2>
    </div>
    <div class="panel-body core-body">
      <div class="reactor" id="reactor">
        <span class="ring ring-a"></span>
        <span class="ring ring-b"></span>
        <span class="ring ring-c"></span>
        <span class="core">
          <b id="reactorTitle">待命</b>
          <i id="reactorSub">等待数据</i>
        </span>
      </div>

      <div class="stats">
        <div><b id="statClasses">0</b><span>类别</span></div>
        <div><b id="statPhotos">0</b><span>照片</span></div>
      </div>

      <p class="train-info" id="trainInfo">至少要有 2 个类别，每类至少 1 张照片。</p>
      <button class="btn launch" id="trainBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M13 3 5 14h6l-1 7 8-11h-6l1-7Z" fill="currentColor"/></svg>
        启动训练
      </button>
      <div class="progress" id="trainProgress" hidden><span id="trainStage">正在准备数据…</span></div>
      <p class="hint" id="trainHint" hidden></p>
    </div>
    <div class="panel-foot badge" id="modelBadge" hidden><i></i>模型已就绪，可以开始测试</div>
  </section>

  <!-- 03 测试舱 -->
  <section class="panel panel-test" id="step-test">
    <div class="panel-head">
      <span class="panel-code">STEP 03</span>
      <h2>测试</h2>
    </div>
    <div class="panel-body test-body" id="testPanel">
      <label class="dropzone" id="dropzone" for="testFile">
        <span class="drop-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 16V4m0 0-4 4m4-4 4 4" stroke="currentColor" stroke-width="2"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="2"/></svg>
        </span>
        <b>喂它一张新照片</b>
        <span>拖到这里，或点击选择</span>
        <small>训练时没见过的照片，才是真考试</small>
        <input id="testFile" type="file" accept="image/*" hidden>
      </label>

      <div class="test-lock" id="testLock">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 10V7.5a3.5 3.5 0 1 1 7 0V10" stroke="currentColor" stroke-width="1.8"/></svg>
        <p id="testLockText">先完成训练，才能开始测试。</p>
      </div>

      <div class="result" id="testResult" hidden></div>
    </div>
    <div class="panel-foot">答案由 SVM 给出；百分比条是最像的 5 张训练照片的投票。</div>
  </section>
</main>

<footer class="hud-bottom">
  <span><i class="live"></i>所有照片只保存在这台设备的浏览器里，不会上传</span>
  <button class="link-btn" id="clearAllBtn">清空全部数据</button>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <span class="modal-code">CONFIRM</span>
    <h3 id="modalTitle">确认删除</h3>
    <p id="modalText"></p>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">取消</button>
      <button class="btn danger" id="modalOk">删除</button>
    </div>
  </div>
</div>

<script src="js/db.js?v=20261110"></script>
<script src="js/features.js?v=20261110"></script>
<script src="js/app.js?v=20261110"></script>
</body>
</html>
